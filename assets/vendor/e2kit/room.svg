<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9E0D2"/><stop offset="1" stop-color="#DCCFBD"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9DEE5"/><stop offset="1" stop-color="#EDF1EA"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A38A70"/><stop offset="1" stop-color="#8C745D"/></linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF4DE" stop-opacity="0.55"/><stop offset="1" stop-color="#FFF4DE" stop-opacity="0"/></linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2B2118" stop-opacity="0.28"/></radialGradient>
